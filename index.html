<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bantam Labs — Independent software studio</title>
  <meta name="description" content="Bantam Labs is an independent studio that designs, builds, and sells its own software products.">
  <link rel="canonical" href="https://bantamlabs.com/">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1f20" media="(prefers-color-scheme: dark)">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bantam Labs">
  <meta property="og:title" content="Bantam Labs">
  <meta property="og:description" content="An independent studio building software products.">
  <meta property="og:url" content="https://bantamlabs.com/">
  <meta property="og:image" content="https://bantamlabs.com/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Bantam Labs hen">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Bantam Labs">
  <meta name="twitter:description" content="An independent studio building software products.">
  <meta name="twitter:image" content="https://bantamlabs.com/assets/img/og-image.png">
  <meta name="twitter:image:alt" content="The Bantam Labs hen">

  <link rel="preload" href="/assets/fonts/bebas-neue-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/analytics.js" defer></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Bantam Labs LLC",
    "url": "https://bantamlabs.com/",
    "logo": "https://bantamlabs.com/assets/img/apple-touch-icon.png",
    "email": "hello@bantamlabs.com"
  }
  </script>
</head>
<body>
  <header class="hero wrap">
    <h1>
      <picture>
        <source media="(prefers-color-scheme: dark)"
                srcset="/assets/img/logo-reversed-360.webp 360w, /assets/img/logo-reversed-720.webp 720w"
                sizes="(min-width: 524px) 288px, 55vw" width="360" height="532">
        <img class="logo"
             src="/assets/img/logo-360.webp"
             srcset="/assets/img/logo-360.webp 360w, /assets/img/logo-720.webp 720w"
             sizes="(min-width: 524px) 288px, 55vw"
             width="360" height="520"
             alt="Bantam Labs"
             fetchpriority="high">
      </picture>
    </h1>
    <p class="tagline">An independent studio building software products.</p>
  </header>

  <main>
    <section class="section wrap" aria-labelledby="products-heading">
      <h2 id="products-heading">Products</h2>
      <ul class="cards">
        <!--
          To add a product, add a card like this and remove the placeholder below:

          <li class="card">
            <h3><a href="/products/product-name/">Product Name</a></h3>
            <p>One sentence about what it does.</p>
          </li>
        -->
        <li class="card card-has-logo">
          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="/assets/img/parlaycards-mark-reversed.svg">
            <img class="card-logo" src="/assets/img/parlaycards-mark.svg" width="64" height="64" alt="">
          </picture>
          <h3><a href="https://parlaycards.ai">ParlayCards.ai</a></h3>
          <p>Snap a photo of your parlay card and track its results as the games play out.</p>
          <figure class="card-demo">
            <img class="card-shot" src="/assets/img/parlaycards-photo-360.webp" srcset="/assets/img/parlaycards-photo-360.webp 360w, /assets/img/parlaycards-photo-720.webp 720w" sizes="(max-width: 36rem) 14rem, 13rem" width="360" height="638" loading="lazy" alt="Photo of a paper parlay card with picks 153, 166, and 170 circled">
            <svg class="card-arrow" viewBox="0 0 48 24" aria-hidden="true" focusable="false">
              <path d="M2 12h40M32 3l10 9-10 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <img class="card-shot" src="/assets/img/parlaycards-entry-360.webp" srcset="/assets/img/parlaycards-entry-360.webp 360w, /assets/img/parlaycards-entry-720.webp 720w" sizes="(max-width: 36rem) 14rem, 13rem" width="360" height="638" loading="lazy" alt="ParlayCards.ai entry screen showing those three picks with live scores and results">
          </figure>
        </li>
      </ul>
    </section>

    <section class="section wrap" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact</h2>
      <p>Questions or business inquiries:</p>
      <p><a class="email" href="mailto:hello@bantamlabs.com">hello@bantamlabs.com</a></p>
    </section>
  </main>

  <footer class="site-footer wrap">
    <p>&copy; 2026 Bantam Labs LLC</p>
  </footer>
</body>
</html>
